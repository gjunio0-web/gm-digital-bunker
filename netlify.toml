[build]
  command = "npm run build"
  publish = "dist"

# Hashed build assets: the file name changes with the content, so they can be cached for a year.
# (public/ files keep fixed names and are deliberately not covered.)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The site is never framed by another page (enforced). X-Frame-Options covers older browsers.
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    # Full policy in report-only mode: violations show in the browser console and block nothing.
    # Inline scripts and style attributes are still allowed ('unsafe-inline'); tightening them needs
    # per-build hashes. HSTS is not set here: Netlify already sends it on the custom domain
    # (max-age=31536000, no subdomains, no preload), kept as decided on 2026-10-30.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://southamerica-east1-gmdb-qualidade.cloudfunctions.net https://southamerica-east1-gmdb-producao.cloudfunctions.net; form-action 'self' https://southamerica-east1-gmdb-qualidade.cloudfunctions.net https://southamerica-east1-gmdb-producao.cloudfunctions.net; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
